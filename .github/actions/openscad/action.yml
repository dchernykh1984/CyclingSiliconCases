name: Install OpenSCAD
description: >
  Свежий OpenSCAD из AppImage. Сборка из apt — 2021 года, она не знает движка
  manifold и считает булевы операции с импортированной сеткой минутами вместо
  секунд. AppImage распаковывается, а не монтируется: FUSE на раннерах нет.

runs:
  using: composite
  steps:
    - name: Install openscad
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          fonts-dejavu-core libgl1 libglu1-mesa libegl1 libopengl0 \
          libfontconfig1 libfreetype6 libharfbuzz0b libdouble-conversion3 \
          libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libdbus-1-3
        curl -sSLo "$RUNNER_TEMP/openscad.AppImage" \
          https://files.openscad.org/snapshots/OpenSCAD-2026.09.18-x86_64.AppImage
        chmod +x "$RUNNER_TEMP/openscad.AppImage"
        (cd "$RUNNER_TEMP" && ./openscad.AppImage --appimage-extract >/dev/null)
        echo "OPENSCAD=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/squashfs-root" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/squashfs-root/AppRun" --version
